# Mise en ligne de getdevuelta.com (site + outil) à chaque changement sur la
# branche main, ou à la demande (onglet Actions).
# Le jeton Cloudflare est rangé dans les secrets du dépôt
# (CLOUDFLARE_API_TOKEN) : il n'apparaît jamais dans le code.

name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Clé secrète Paystack (paiement en ligne), rangée dans les secrets du dépôt.
  # Absente : le paiement en ligne reste désactivé, le reste fonctionne.
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
  CLOUDFLARE_ACCOUNT_ID: 381946ed74159485b04c186b0347ff6f
  # INTERRUPTEUR. « non » : on construit et on teste, rien ne part en ligne.
  # Passer à « oui » seulement quand Steven a validé le site.
  MISE_EN_LIGNE: "non"

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Construction du site
        run: npm run build

      - name: Jeton Cloudflare présent ?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Secret CLOUDFLARE_API_TOKEN absent, site construit mais pas mis en ligne."

      # Contrôle de la clé sans rien publier : chaque résultat apparaît comme
      # une note (annotation) du passage, sans jamais afficher la clé.
      - name: Contrôle de la clé (rien n'est mis en ligne)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          resume() { jq -c "{ok: .success, $1 erreurs: [.errors[]? | \"\(.code) \(.message)\"]}"; }
          echo "::notice title=1 Clé (compte)::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | resume 'statut: .result.status,')"
          echo "::notice title=2 Workers du compte::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | resume 'nombre: (.result // [] | length),')"
          echo "::notice title=3 Base D1 devuelta sur ce compte::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/03f20132-197b-4409-8ef0-ffcbf001a132" | resume 'nom: .result.name,')"
          echo "::notice title=4 Domaine getdevuelta.com::$(api "/zones?name=getdevuelta.com" | resume 'trouve: (.result // [] | length), statut: .result[0].status, compte: .result[0].account.id,')"
          echo "::notice title=5 Domaines Workers::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | resume 'liste: [.result[]? | .hostname],')"
          echo "::notice title=6 Sous-domaine workers.dev::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | resume 'nom: .result.subdomain,')"
          echo "::notice title=7 DNS public::apex=$(dig +short getdevuelta.com A | tr '\n' ' ') www=$(dig +short www.getdevuelta.com | tr '\n' ' ')"
          echo "::notice title=8 Réponse actuelle::$(curl -s -o /dev/null -w 'HTTP %{http_code} serveur=%header{server}' https://getdevuelta.com/ || true)"
          npx wrangler deploy --dry-run --outdir /tmp/essai-worker > /tmp/essai.log 2>&1 && echo "::notice title=9 Essai à blanc::OK" || echo "::warning title=9 Essai à blanc::$(tail -5 /tmp/essai.log | tr '\n' ' ')"

      - name: Mise en ligne sur Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui'
        run: npx wrangler deploy

      - name: Clé de paiement Paystack
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui' && env.PAYSTACK_SECRET_KEY != ''
        run: printf '%s' "$PAYSTACK_SECRET_KEY" | npx wrangler secret put PAYSTACK_SECRET_KEY

      - name: Vérification du site en ligne
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui'
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://getdevuelta.com/ || true)
            echo "essai $i : HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          test "$code" = "200"
          # Premier appel à l'API : crée les tables de la base si besoin.
          curl -s -o /dev/null -w 'API : HTTP %{http_code}\n' https://getdevuelta.com/api/outil/session || true
          echo "--- robots.txt servi ---"
          curl -s https://getdevuelta.com/robots.txt | head -40
