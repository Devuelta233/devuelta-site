# Mise en ligne de getdevuelta.com (site + outil) à chaque changement sur la
# branche main, ou à la demande (onglet Actions).
# Le jeton Cloudflare est rangé dans les secrets du dépôt
# (CLOUDFLARE_API_TOKEN) : il n'apparaît jamais dans le code. Idem pour les
# clés Paystack (PAYSTACK_SECRET_KEY) et du robot Telegram (TELEGRAM_BOT_TOKEN).

name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Les clés Paystack (paiement en ligne) et du robot Telegram ne sont données
  # qu'aux étapes qui les posent sur le Worker (jamais à l'installation, aux
  # tests ni à la construction). Absentes : paiement ou robot éteint, le reste fonctionne.
  CLOUDFLARE_ACCOUNT_ID: 381946ed74159485b04c186b0347ff6f
  # INTERRUPTEUR. « non » : on construit et on teste, rien ne part en ligne.
  # Passer à « oui » seulement quand Steven a validé le site.
  MISE_EN_LIGNE: "oui"

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Construction du site
        run: npm run build

      - name: Jeton Cloudflare présent ?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Secret CLOUDFLARE_API_TOKEN absent, site construit mais pas mis en ligne."

      # Quelles clés sont posées dans les secrets du dépôt (oui ou non, jamais leur valeur).
      - name: Clés présentes ?
        id: cles
        run: |
          echo "paystack=${{ secrets.PAYSTACK_SECRET_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "telegram=${{ secrets.TELEGRAM_BOT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Contrôle de la clé sans rien publier : chaque résultat apparaît comme
      # une note (annotation) du passage, sans jamais afficher la clé.
      - name: Contrôle de la clé (rien n'est mis en ligne)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          resume() { jq -c "{ok: .success, $1 erreurs: [.errors[]? | \"\(.code) \(.message)\"]}"; }
          echo "::notice title=1 Clé (compte)::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | resume 'statut: .result.status,')"
          echo "::notice title=2 Workers du compte::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | resume 'nombre: (.result // [] | length),')"
          echo "::notice title=3 Base D1 devuelta sur ce compte::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/03f20132-197b-4409-8ef0-ffcbf001a132" | resume 'nom: .result.name,')"
          echo "::notice title=4 Domaine getdevuelta.com::$(api "/zones?name=getdevuelta.com" | resume 'trouve: (.result // [] | length), statut: .result[0].status, compte: .result[0].account.id,')"
          echo "::notice title=5 Domaines Workers::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | resume 'liste: [.result[]? | .hostname],')"
          echo "::notice title=6 Sous-domaine workers.dev::$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | resume 'nom: .result.subdomain,')"
          echo "::notice title=7 DNS public::apex=$(dig +short getdevuelta.com A | tr '\n' ' ') www=$(dig +short www.getdevuelta.com | tr '\n' ' ')"
          echo "::notice title=8 Réponse actuelle::$(curl -s -o /dev/null -w 'HTTP %{http_code} serveur=%header{server}' https://getdevuelta.com/ || true)"
          npx wrangler deploy --dry-run --outdir /tmp/essai-worker > /tmp/essai.log 2>&1 && echo "::notice title=9 Essai à blanc::OK" || echo "::warning title=9 Essai à blanc::$(tail -5 /tmp/essai.log | tr '\n' ' ')"

      - name: Mise en ligne sur Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui'
        run: npx wrangler deploy

      - name: Clé de paiement Paystack
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui' && steps.cles.outputs.paystack == 'true'
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: printf '%s' "$PAYSTACK_SECRET_KEY" | npx wrangler secret put PAYSTACK_SECRET_KEY

      - name: Clé du robot Telegram
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui' && steps.cles.outputs.telegram == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      # Robot Telegram : branche le webhook (avec la clé dérivée que le site
      # vérifie, même calcul que server/telegram.ts), pose le profil public
      # (shared/telegram-profil.json), la photo s'il n'en a pas, et affiche son
      # état. Appels directs à Telegram : la protection anti-robots de Cloudflare
      # ne les gêne pas. Ne bloque jamais la mise en ligne. La clé n'est jamais affichée.
      - name: Robot Telegram (branchement et profil)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui' && steps.cles.outputs.telegram == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          T="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          P=shared/telegram-profil.json
          URL=https://getdevuelta.com/api/telegram
          appel() { curl -s -X POST -H 'Content-Type: application/json' -d "$2" "$T/$1" | jq -c '{ok, erreur: .description}'; }
          CLE=$(printf 'devuelta-telegram:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-64)
          echo "webhook : $(appel setWebhook "$(jq -nc --arg url "$URL" --arg cle "$CLE" '{url: $url, secret_token: $cle, allowed_updates: ["message", "callback_query"], max_connections: 1}')")"
          for l in fr es en; do
            echo "$l description : $(appel setMyDescription "$(jq -c --arg l "$l" '{description: .[$l].description, language_code: $l}' "$P")")"
            echo "$l présentation : $(appel setMyShortDescription "$(jq -c --arg l "$l" '{short_description: .[$l].courte, language_code: $l}' "$P")")"
            echo "$l commandes : $(appel setMyCommands "$(jq -c --arg l "$l" '{commands: .[$l].commandes, language_code: $l}' "$P")")"
          done
          # Application dans une autre langue : l'anglais.
          echo "autres langues : $(appel setMyDescription "$(jq -c '{description: .en.description}' "$P")") $(appel setMyShortDescription "$(jq -c '{short_description: .en.courte}' "$P")") $(appel setMyCommands "$(jq -c '{commands: .en.commandes}' "$P")")"
          # Photo de profil (spirale Devuelta) : seulement si le robot n'en a pas encore.
          ID=$(curl -s "$T/getMe" | jq -r '.result.id // empty')
          if [ -n "$ID" ] && [ "$(curl -s "$T/getUserProfilePhotos?user_id=$ID&limit=1" | jq -r '.result.total_count // 0')" = "0" ]; then
            echo "photo : $(curl -s -F 'photo={"type":"static","photo":"attach://image"}' -F image=@public/reseaux/profil-1080.jpg "$T/setMyProfilePhoto" | jq -c '{ok, erreur: .description}')"
          fi
          NOM=$(curl -s "$T/getMe" | jq -r '.result.username // "?"')
          ETAT=$(curl -s "$T/getWebhookInfo" | jq -c --arg url "$URL" '{branche: (.result.url == $url), en_attente: .result.pending_update_count, derniere_erreur: .result.last_error_message}')
          echo "::notice title=Robot Telegram::@$NOM $ETAT"

      - name: Vérification du site en ligne
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MISE_EN_LIGNE == 'oui'
        run: |
          # 403 + en-tête cf-mitigated : la protection anti-robots de Cloudflare
          # bloque les serveurs de GitHub, mais le site répond aux visiteurs.
          for i in $(seq 1 18); do
            entetes=$(curl -s -D - -o /dev/null https://getdevuelta.com/ || true)
            code=$(printf '%s' "$entetes" | awk 'NR==1{print $2}')
            echo "essai $i : HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            if [ "$code" = "403" ] && printf '%s' "$entetes" | grep -qi '^cf-mitigated'; then
              echo "::notice title=Site en ligne::Protection anti-robots active (serveurs GitHub bloqués), le site répond."
              code=200
              break
            fi
            sleep 10
          done
          test "$code" = "200"
          # Premier appel à l'API : crée les tables de la base si besoin.
          curl -s -o /dev/null -w 'API : HTTP %{http_code}\n' https://getdevuelta.com/api/outil/auth/etat || true
          echo "--- robots.txt servi ---"
          curl -s https://getdevuelta.com/robots.txt | head -40
